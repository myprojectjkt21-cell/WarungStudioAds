:root{
  --bg:#0b0c10;
  --bg-elevated:#12141c;
  --surface:#171923;
  --surface-2:#212432;
  --surface-3:#2a2e3f;
  --border:rgba(255,255,255,.09);
  --border-strong:rgba(255,255,255,.16);
  --primary:#ee1d23;
  --primary-glow:rgba(238,29,35,.42);
  --orange:#ff6a00;
  --yellow:#ffeb3b;
  --amber:#f59e0b;
  --gofood:#00aa5b;
  --grabfood:#00b14f;
  --shopeefood:#ee4d2d;
  --text:#f8fafc;
  --text-muted:#94a3b8;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

[data-theme="light"]{
  --bg:#F5F5F5;
  --bg-elevated:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#F1F5F9;
  --surface-3:#E2E8F0;
  --border:rgba(0,0,0,.09);
  --border-strong:rgba(0,0,0,.16);
  --text:#111111;
  --text-muted:#64748b;
  --nav-bg:rgba(255,255,255,.92)
}

[data-theme="dark"]{
  --nav-bg:rgba(11,12,16,.88)
}

[data-theme="light"] .input-field{
  background:#FFFFFF;
  color:#111;
  border-color:rgba(0,0,0,.18)
}

.generate-btn{
  width:100%;
  border-radius:16px;
  padding:16px 18px;
  font-weight:900;
  font-size:1rem;
  color:#fff;
  background:linear-gradient(90deg,#ee1d23,#ff6a00,#ffeb3b);
  background-size:180% 100%;
  box-shadow:0 14px 30px rgba(238,29,35,.35);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px
}

.generate-btn.small{
  padding:12px 14px;
  font-size:.86rem;
  border-radius:13px
}

.generate-btn:disabled{
  opacity:.65;
  cursor:wait
}

.sticky-download{
  position:sticky;
  bottom:78px;
  z-index:30;
  padding:8px;
  border-radius:16px;
  background:var(--surface);
  border:1px solid var(--border-strong);
  box-shadow:0 12px 30px rgba(0,0,0,.18)
}

@media(min-width:1024px){
  .sticky-download{
    position:static;
    box-shadow:none;
    padding:0;
    border:0;
    background:transparent
  }
}

.video-phone{
  width:min(100%,250px);
  aspect-ratio:9/16;
  border-radius:26px;
  overflow:hidden;
  position:relative;
  border:5px solid #111;
  box-shadow:0 18px 40px rgba(0,0,0,.35);
  background:#111;
  color:#fff
}

.video-phone .vp-photo{
  width:100%;
  height:52%;
  -o-object-fit:cover;
     object-fit:cover;
  display:block
}

.vp-zoom{
  animation:vpZoom 6s linear infinite
}

.vp-steam span{
  position:absolute;
  width:34px;
  height:34px;
  border-radius:50%;
  background:rgba(255,255,255,.55);
  filter:blur(6px);
  animation:vpSteam 2.2s ease-in infinite
}

@keyframes vpZoom{
  from{
    transform:scale(1)
  }

  to{
    transform:scale(1.1)
  }
}

@keyframes vpSteam{
  0%{
    transform:translateY(0) scale(.7);
    opacity:0
  }

  35%{
    opacity:.9
  }

  100%{
    transform:translateY(-90px) scale(1.25);
    opacity:0
  }
}

@keyframes vpFlash{
  0%,100%{
    background:#FFEB00;
    color:#000
  }

  50%{
    background:#ee1d23;
    color:#fff
  }
}

.vp-flash-price{
  animation:vpFlash .7s ease-in-out infinite
}

@keyframes vpWiggle{
  0%,100%{
    transform:rotate(-3deg)
  }

  50%{
    transform:rotate(3deg) scale(1.05)
  }
}

.vp-wiggle{
  animation:vpWiggle .6s ease-in-out infinite
}

@keyframes vpSlideOld{
  0%{
    transform:translateX(-120%);
    opacity:0
  }

  25%,100%{
    transform:translateX(0);
    opacity:1
  }
}

@keyframes vpBounceNew{
  0%{
    transform:translateY(60px) scale(.7);
    opacity:0
  }

  55%{
    transform:translateY(-6px) scale(1.08);
    opacity:1
  }

  75%{
    transform:translateY(0) scale(1)
  }

  100%{
    transform:translateY(0) scale(1)
  }
}

.vp-slide-old{
  animation:vpSlideOld 6s ease infinite
}

.vp-bounce-new{
  animation:vpBounceNew 6s ease infinite
}

@keyframes vpNeon{
  0%,100%{
    box-shadow:0 0 0 3px #FF2EA6,0 0 22px #FF2EA6
  }

  50%{
    box-shadow:0 0 0 3px #00E5FF,0 0 28px #00E5FF
  }
}

.vp-neon{
  animation:vpNeon 1.1s ease-in-out infinite
}

.vp-paused .vp-zoom,.vp-paused .vp-steam span,.vp-paused .vp-flash-price,.vp-paused .vp-wiggle,.vp-paused .vp-slide-old,.vp-paused .vp-bounce-new,.vp-paused .vp-neon{
  animation-play-state:paused
}

.reel-card{
  border:2px solid var(--border-strong);
  border-radius:13px;
  padding:9px 8px;
  text-align:left;
  background:var(--surface-2);
  font-size:.72rem;
  line-height:1.35
}

.reel-card.active{
  border-color:var(--yellow);
  box-shadow:0 0 0 2px rgba(255,235,59,.35);
  background:var(--surface)
}

.reel-card strong{
  display:block;
  font-size:.76rem;
  margin-bottom:2px
}

html,body{

body{

button,input{

button{

.font-playfair{

.input-field{

  font-size:.88rem;
  font-weight:600;
  outline:none

.option-card.active{

.tab-btn{

  flex-direction:column;
  align-items:center;
  gap:3px;
  text-align:center
}

.tab-btn.active{
  background:linear-gradient(180deg,var(--surface-3),var(--surface-2));
  color:#fff;
  border:1px solid rgba(238,29,35,.45);
  box-shadow:0 4px 12px rgba(0,0,0,.35)
}

.ojol-chip{
  padding:9px 13px;
  border-radius:11px;
  font-size:.76rem;
  font-weight:800;
  border:1px solid var(--border-strong);
  background:var(--surface-2);
  color:var(--text-muted);
  display:flex;
  align-items:center;
  gap:6px
}

.ojol-chip.active[data-ojol="gofood"]{

  color:#4ade80
}

.ojol-chip.active[data-ojol="grabfood"]{
  background:rgba(0,177,79,.2);
  border-color:var(--grabfood);
  color:#4ade80
}

.ojol-chip.active[data-ojol="shopeefood"]{
  background:rgba(238,77,45,.2);
  border-color:var(--shopeefood);
  color:#fb923c
}

.pulse{

}

@keyframes pulseGlow{

  }

.trial-blink{

.trial-btn{

<style id="warungads-v6-global-ui">
  :root {
    --bg: #090a0f !important;
    --bg-elevated: #11131c !important;
    --surface: #161926 !important;
    --surface-2: #1e2233 !important;
    --surface-3: #282d42 !important;
    --border: rgba(255, 255, 255, 0.08) !important;
    --border-strong: rgba(255, 255, 255, 0.16) !important;
    --primary: #e11d48 !important;
    --primary-glow: rgba(225, 29, 72, 0.42) !important;
    --orange: #f97316 !important;
    --yellow: #facc15 !important;
    --amber: #f59e0b !important;
    --text: #f8fafc !important;
    --text-muted: #94a3b8 !important;
    --input-bg: #0d0f17 !important;
    --nav-bg: rgba(9, 10, 15, 0.86) !important;
  }

  [data-theme="light"] {
    --bg: #f8fafc !important;
    --bg-elevated: #ffffff !important;
    --surface: #ffffff !important;
    --surface-2: #f1f5f9 !important;
    --surface-3: #e2e8f0 !important;
    --border: rgba(15, 23, 42, 0.08) !important;
    --border-strong: rgba(15, 23, 42, 0.16) !important;
    --text: #0f172a !important;
    --text-muted: #64748b !important;
    --input-bg: #ffffff !important;
    --nav-bg: rgba(255, 255, 255, 0.9) !important;
  }

  /* 1. Perbaikan Kontras Tombol Utama (Standar WCAG AAA) */
  .generate-btn {
    border-radius: 14px !important;
    padding: 15px 20px !important;
    font-weight: 800 !important;
    font-size: 0.98rem !important;
    letter-spacing: -0.01em !important;
    color: #ffffff !important;
    background: linear-gradient(135deg, #e11d48 0%, #ea580c 55%, #d97706 100%) !important;
    box-shadow: 0 12px 28px -6px rgba(225, 29, 72, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.22) !important;
    transition: transform 0.16s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s ease, filter 0.2s ease !important;
  }

  .generate-btn:hover:not(:disabled) {
    transform: translateY(-1.5px) !important;
    filter: brightness(1.07) !important;
    box-shadow: 0 16px 34px -6px rgba(225, 29, 72, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.3) !important;
  }

  /* 2. Input & Touch Target Standar Global (44px+ Minimum) */
  .input-field {
    background: var(--input-bg) !important;
    color: var(--text) !important;
    border: 1.5px solid var(--border-strong) !important;
    border-radius: 12px !important;
    min-height: 44px !important;
    transition: border-color 0.2s ease, box-shadow 0.2s ease !important;
  }

  .input-field:focus {
    border-color: var(--primary) !important;
    box-shadow: 0 0 0 4px rgba(225, 29, 72, 0.18) !important;
  }

  .tab-btn {
    min-height: 48px !important;
    padding: 8px 6px !important;
    font-size: 0.71rem !important;
    border-radius: 12px !important;
    justify-content: center !important;
    transition: all 0.18s ease !important;
  }

  .tab-btn:hover:not(.active) {
    background: var(--surface-2) !important;
    color: var(--text) !important;
  }

  .option-card, .reel-card, .ojol-chip {
    min-height: 42px !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;

<script id="wa-dynamic-header-engine">
(function() {
  var TOP_THRESHOLD = 35; // Header hanya muncul jika posisi scroll berada di batas paling atas (<= 35px)

  function updateHeaderVisibility() {
    var st = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    var navs = document.querySelectorAll('nav.sticky, nav[aria-label="Navigasi utama"], nav');
    if (navs.length === 0) return;

    for (var i = 0; i < navs.length; i++) {
      var nav = navs[i];
      if (st > TOP_THRESHOLD) {
        // Selama user berada di area menu fitur / dashboard (scroll > 35px), sembunyikan header sepenuhnya
        nav.classList.add("wa-header-hidden");
      } else {
        // Hanya munculkan kembali ketika user sudah scroll sampai batas paling atas (<= 35px)
        nav.classList.remove("wa-header-hidden");
      }
    }
  }

  window.addEventListener("scroll", updateHeaderVisibility, { passive: true });
  window.addEventListener("resize", updateHeaderVisibility, { passive: true });
  window.addEventListener("DOMContentLoaded", updateHeaderVisibility);
  setTimeout(updateHeaderVisibility, 200);
})();
</script>

        '</div>' +
        '<div style="display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px;">' +
          '<button type="button" id="wa-cam-shutter" class="generate-btn" style="padding:14px 18px !important;">📸 JEPRET FOTO MAKANAN SEKARANG</button>' +
          '<button type="button" id="wa-cam-native-trigger" style="width:100%;padding:10px;border-radius:11px;border:1px solid var(--border-strong);background:var(--surface-2);font-size:.76rem;font-weight:800;color:var(--text-muted);">Atau Pakai Aplikasi Kamera Bawaan HP</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(modal);

    document.getElementById("wa-cam-close").addEventListener("click", closeLiveCamera);
    modal.addEventListener("click", function (e) {

    });

      camFacing = camFacing === "environment" ? "user" : "environment";
      startCameraStream();
    });

    var warmBtn = document.getElementById("wa-cam-warm");
    warmBtn.addEventListener("click", function () {
      camWarmFilter = !camWarmFilter;

    });

    function triggerNativeFallback() {
      closeLiveCamera();
      var inputId = camTarget === "gallery" ? "galleryCameraDirectInput" : "cameraDirectInput";

      if (el) el.click();
    }

    document.getElementById("wa-cam-fallback-btn").addEventListener("click", triggerNativeFallback);
    document.getElementById("wa-cam-native-trigger").addEventListener("click", triggerNativeFallback);

    document.getElementById("wa-cam-shutter").addEventListener("click", function () {
      var videoEl = document.getElementById("wa-cam-video");
      if (!videoEl || !videoEl.videoWidth) {
        triggerNativeFallback();
        return;
      }
      var flashEl = document.getElementById("wa-cam-flash-fx");
      if (flashEl) {
        flashEl.classList.add("active");
        setTimeout(function () { flashEl.classList.remove("active"); }, 180);
      }
      var capCanvas = document.createElement("canvas");
      var size = Math.min(videoEl.videoWidth, videoEl.videoHeight);
      var sx = (videoEl.videoWidth - size) / 2;
      var sy = (videoEl.videoHeight - size) / 2;
      capCanvas.width = 1080;
      capCanvas.height = 1080;
      var ctx = capCanvas.getContext("2d");
      if (camWarmFilter) {
        ctx.filter = "contrast(1.08) saturate(1.22) brightness(1.04)";
      }
      if (camFacing === "user") {
        ctx.translate(1080, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(videoEl, sx, sy, size, size, 0, 0, 1080, 1080);
      var dataUrl = capCanvas.toDataURL("image/jpeg", 0.94);
      setTimeout(function () {
        closeLiveCamera();
        if (window.__warungApplyCameraPhoto) {
          window.__warungApplyCameraPhoto(dataUrl, camTarget);
        }
      }, 160);
    });
  }

  function stopCameraStream() {
    if (camStream) {
      camStream.getTracks().forEach(function (t) { t.stop(); });
      camStream = null;
    }
  }

  function startCameraStream() {
    ensureCameraModal();
    stopCameraStream();
    var videoEl = document.getElementById("wa-cam-video");
    var errEl = document.getElementById("wa-cam-error");
    if (errEl) errEl.style.display = "none";
    if (videoEl) {
      videoEl.classList.toggle("mirrored", camFacing === "user");
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      if (errEl) errEl.style.display = "flex";
      return;
    }

    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: camFacing },
        width: { ideal: 1440 },
        height: { ideal: 1440 }
      },
      audio: false
    }).then(function (stream) {
      camStream = stream;
      if (videoEl) {
        videoEl.srcObject = stream;
        videoEl.play().catch(function () {});
      }
    }).catch(function () {
      if (errEl) errEl.style.display = "flex";
    });
  }

  function openWarungLiveCamera(target) {
    camTarget = target || "main";
    ensureCameraModal();
    var modal = document.getElementById("wa-live-cam-modal");
    if (modal) modal.classList.add("open");
    startCameraStream();
  }

  function closeLiveCamera() {
    stopCameraStream();
    var modal = document.getElementById("wa-live-cam-modal");
    if (modal) modal.classList.remove("open");
  }

  window.openWarungLiveCamera = openWarungLiveCamera;

  var croTimer = null;
  var obs = new MutationObserver(function () {
    if (document.getElementById("wa-v6-cro-bar")) return;
    if (croTimer) return;
    croTimer = requestAnimationFrame(function () {
      croTimer = null;
      injectEnhancements();
    });
  });
  obs.observe(document.getElementById("root") || document.body, { childList: true, subtree: true });
  if (document.readyState !== "loading") injectEnhancements();
  else document.addEventListener("DOMContentLoaded", injectEnhancements);
})();
</script>

    ta.select();
    try { document.execCommand("copy"); } catch (e) {}

      .catch(function (err) {
        showStatus(
          "ℹ️ Info Gemini Veo API: " + err.message + "<br><br>" +
          "💡 <strong>Solusi Langsung Tanpa Biaya API:</strong> Klik tombol <strong>"🚀 Buka & Generate di Aplikasi Gemini AI"</strong> di atas untuk langsung membuat video di aplikasi Gemini, atau gunakan tombol <strong>"Unduh Video 6 Detik"</strong> bawaan studio!",
          "info"
        );
      });
  }

  function pollVeoOperation(apiKey, opName) {
    var attempts = 0;
    var maxAttempts = 24;
    var pollUrl = "https://generativelanguage.googleapis.com/v1beta/" + opName + "?key=" + encodeURIComponent(apiKey);

    var timer = setInterval(function () {
      attempts++;
      showStatus("⏳ Merender Video Reels di Server Gemini Veo... (" + (attempts * 5) + " detik berjalan)", "info");

      fetch(pollUrl)
        .then(function (r) { return r.json(); })
        .then(function (op) {
          if (op.done) {
            clearInterval(timer);
            if (op.error) {
              showStatus("⚠️ Gagal merender video Veo: " + (op.error.message || "Error"), "error");
              return;
            }
            var videoUri =
              op.response &&
              op.response.generateVideoResponse &&
              op.response.generateVideoResponse.generatedSamples &&
              op.response.generateVideoResponse.generatedSamples[0] &&
              op.response.generateVideoResponse.generatedSamples[0].video &&
              op.response.generateVideoResponse.generatedSamples[0].video.uri;

            if (videoUri) {
              var finalUrl = videoUri + (videoUri.indexOf("?") === -1 ? "?key=" : "&key=") + encodeURIComponent(apiKey);
              var resultContainer = document.getElementById("wa-gemini-veo-result");
              if (resultContainer) {
                resultContainer.style.display = "block";
                resultContainer.innerHTML =
                  '<div style="margin-top:10px;padding:10px;border-radius:12px;background:rgba(15,23,42,0.9);border:1px solid #22c55e;text-align:center;">' +
                    '<div style="font-size:.78rem;font-weight:800;color:#4ade80;margin-bottom:8px;">🎉 VIDEO REELS GEMINI VEO SIAP!</div>' +
                    '<video src="' + finalUrl + '" controls autoplay loop playsinline style="width:100%;max-width:240px;border-radius:14px;margin:0 auto;display:block;"></video>' +
                    '<a href="' + finalUrl + '" target="_blank" download="warungads-gemini-reels.mp4" class="wa-gemini-btn-primary" style="margin-top:10px;text-decoration:none;">⬇️ Unduh Video MP4 Gemini Veo</a>' +
                  '</div>';
              }
              showStatus("🎉 Video Reels berhasil dibuat langsung oleh Gemini Veo API!", "success");
            } else {
              showStatus("⚠️ Render selesai namun URL video tidak ditemukan pada respons API.", "error");
            }
          } else if (attempts >= maxAttempts) {
            clearInterval(timer);
            showStatus("⚠️ Waktu tunggu render habis. Silakan coba lagi atau gunakan tombol Buka Aplikasi Gemini AI.", "error");
          }
        })
        .catch(function () {
          clearInterval(timer);
          showStatus("⚠️ Koneksi terputus saat mengecek status video Veo.", "error");
        });
    }, 5000);
  }

        '<button type="button" data-gemini-style="viral" class="wa-gemini-style-chip">' +
          '⚡ <strong>Reels Viral</strong><br><span style="font-size:.64rem;opacity:.8;">Hook 3 Detik</span>' +
        '</button>' +
        '<button type="button" data-gemini-style="macro" class="wa-gemini-style-chip">' +
          '🔍 <strong>Macro Detail</strong><br><span style="font-size:.64rem;opacity:.8;">Fokus Tekstur</span>' +

      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">' +
        '<label for="wa-gemini-prompt-input" style="font-size:.7rem;font-weight:800;color:#93c5fd;">Prompt Video Gemini AI (Otomatis dari Menu Kamu):</label>' +
        '<button type="button" id="wa-gemini-reset-prompt" style="font-size:.68rem;font-weight:700;color:#60a5fa;background:none;border:none;cursor:pointer;">🔄 Sinkron Ulang</button>' +
      '</div>' +
      '<textarea id="wa-gemini-prompt-input" class="wa-gemini-textarea" aria-label="Prompt Video Gemini AI"></textarea>' +

      '<div style="display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px;">' +
        '<button type="button" id="wa-gemini-open-app-btn" class="wa-gemini-btn-primary">' +
          '🚀 Buka & Generate di Aplikasi Gemini AI (Auto-Copy Prompt)' +
        '</button>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">' +
          '<button type="button" id="wa-gemini-share-btn" class="wa-gemini-btn-secondary">' +
            '📲 Kirim Foto + Prompt ke App' +
          '</button>' +
          '<button type="button" id="wa-gemini-copy-btn" class="wa-gemini-btn-secondary">' +
            '📋 Salin Prompt Video' +
          '</button>' +
        '</div>' +
      '</div>' +

      '<div class="wa-gemini-api-box">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;">' +
          '<span style="font-size:.72rem;font-weight:800;color:#fde047;">🔑 KONEKSI LANGSUNG GEMINI API KEY (OPSIONAL):</span>' +
          '<button type="button" id="wa-gemini-toggle-guide" style="font-size:.69rem;font-weight:800;color:#38bdf8;background:rgba(56,189,248,0.14);border:1px solid rgba(56,189,248,0.4);padding:4px 9px;border-radius:999px;cursor:pointer;">📖 Panduan 3 Langkah Ambil API Key Gratis ▾</button>' +
        '</div>' +

        '<div id="wa-gemini-guide-box" class="wa-gemini-guide-card" style="display:block;margin-bottom:10px;padding:11px 12px;border-radius:12px;background:rgba(15,23,42,0.88);border:1px solid rgba(96,165,250,0.35);font-size:.72rem;line-height:1.5;color:#e2e8f0;">' +
          '<div style="font-weight:800;color:#fde047;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;">' +
            '<span>💡 CARA MUDAH PAKAI FITUR GEMINI AI (CUMA 30 DETIK):</span>' +
          '</div>' +
          '<div style="margin-bottom:7px;padding:7px 9px;border-radius:8px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.35);color:#a7f3d0;">' +
            '✅ <strong>Opsi 1 (Tanpa API Key - Paling Praktis):</strong> Langsung klik tombol biru <strong>"🚀 Buka & Generate di Aplikasi Gemini AI"</strong> di atas. Tidak perlu daftar API Key!' +
          '</div>' +
          '<div style="font-weight:800;color:#93c5fd;margin-bottom:4px;">🚀 Opsi 2 (Koneksi Real-Time di Dalam Aplikasi via API Key Gratis):</div>' +
          '<ol style="margin:0;padding-left:16px;space-y:4px;">' +
            '<li style="margin-bottom:4px;">Klik tombol <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" style="color:#38bdf8;font-weight:800;text-decoration:underline;">🌐 Buka Google AI Studio (Gratis) ↗</a> lalu login dengan akun Gmail kamu.</li>' +
            '<li style="margin-bottom:4px;">Ketuk tombol biru <strong>"Create API key"</strong> → pilih <strong>"Create API key in new project"</strong> → lalu salin (<em>Copy</em>) kode yang diawali huruf <code style="color:#fde047;">AIzaSy...</code></li>' +
            '<li style="margin-bottom:4px;">Tempel (<em>Paste</em>) kode tersebut ke kotak di bawah → klik <strong>"💾 Simpan"</strong> → lalu klik <strong>"🧠 Bedah Foto via Gemini 2.5"</strong> agar AI menganalisis foto masakanmu secara <em>real-time</em>!</li>' +

    function refreshPrompt(force) {
      if (!promptInput) return;
      if (!customPromptEdited || force) {
        promptInput.value = buildGeminiVeoPrompt(currentStyle);
        if (force) customPromptEdited = false;
      }
    }

    refreshPrompt(true);

    promptInput.addEventListener("input", function () {
      customPromptEdited = true;
    });

    document.getElementById("wa-gemini-reset-prompt").addEventListener("click", function () {
      refreshPrompt(true);
      showStatus("🔄 Prompt disinkronkan ulang dengan nama menu, harga, dan efek terbaru.", "info");
    });

    panel.querySelectorAll("[data-gemini-style]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        panel.querySelectorAll("[data-gemini-style]").forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        currentStyle = btn.getAttribute("data-gemini-style");
        refreshPrompt(true);
      });
    });

    document.getElementById("wa-gemini-open-app-btn").addEventListener("click", function () {
      openGeminiAppDirect(promptInput.value);
    });

    document.getElementById("wa-gemini-share-btn").addEventListener("click", function () {
      sharePhotoAndPromptToGemini(promptInput.value);
    });

    document.getElementById("wa-gemini-copy-btn").addEventListener("click", function () {
      copyTextToClipboard(promptInput.value).then(function () {
        showStatus("✅ Prompt Video Reels Gemini berhasil disalin ke Clipboard!", "success");
      });
    });

    var toggleGuideBtn = document.getElementById("wa-gemini-toggle-guide");

        var isHidden = guideBox.style.display === "none";

          ? "📖 Tutup Panduan API Key ▴"
          : "📖 Panduan 3 Langkah Ambil API Key Gratis ▾";
      });
    }
    var keyInput = document.getElementById("wa-gemini-api-key");
    document.getElementById("wa-gemini-save-key").addEventListener("click", function () {
      var val = keyInput.value.trim();
      try {
        if (val) localStorage.setItem(STORAGE_KEY, val);
        else localStorage.removeItem(STORAGE_KEY);
      } catch (e) {}
      showStatus(val ? "✅ Gemini API Key berhasil disimpan di perangkat ini." : "ℹ️ Gemini API Key dihapus.", "success");
    });

    document.getElementById("wa-gemini-vision-btn").addEventListener("click", function () {
      var key = keyInput.value.trim();
      if (!key) {
        showStatus("⚠️ Masukkan Gemini API Key terlebih dahulu (atau klik 'Buka & Generate di Aplikasi Gemini AI' di atas jika tanpa API Key).", "error");
        return;
      }
      try { localStorage.setItem(STORAGE_KEY, key); } catch (e) {}
      analyzeWithGeminiFlashApi(key, promptInput);
    });

    document.getElementById("wa-gemini-veo-btn").addEventListener("click", function () {
      var key = keyInput.value.trim();
      if (!key) {
        showStatus("⚠️ Masukkan Gemini API Key terlebih dahulu (atau gunakan tombol 'Buka & Generate di Aplikasi Gemini AI' di atas).", "error");
        return;
      }
      try { localStorage.setItem(STORAGE_KEY, key); } catch (e) {}
      generateVideoViaVeoApi(key, promptInput.value);
    });

    // Otomatis perbarui prompt saat user mengetik nama menu / harga / memilih efek
    document.addEventListener("input", function (e) {
      if (e.target !== promptInput && e.target !== keyInput) {
        refreshPrompt(false);
      }
    });
    document.addEventListener("click", function (e) {
      if (e.target && e.target.closest && e.target.closest(".reel-card")) {
        setTimeout(function () { refreshPrompt(false); }, 60);
      }
    });
  }

  var gemTimer = null;
  var obs = new MutationObserver(function () {
    if (document.getElementById("wa-gemini-reels-panel")) return;
    if (gemTimer) return;
    gemTimer = requestAnimationFrame(function () {
      gemTimer = null;
      injectGeminiReelsPanel();
    });
  });
  obs.observe(document.getElementById("root") || document.body, { childList: true, subtree: true });
  if (document.readyState !== "loading") injectGeminiReelsPanel();
  else document.addEventListener("DOMContentLoaded", injectGeminiReelsPanel);
})();
</script>

<script id="wa-voice-studio-engine">
(function () {
  var audioMode = "saved"; // 'saved' | 'live' | 'mute'
  var sizzleEnabled = true;
  var recordedVoiceBlob = null;
  var recordedVoiceUrl = "";
  var isMicPreRecording = false;
  var preMediaRecorder = null;
  var preMicStream = null;
  var meterRAF = null;
  var meterAudioCtx = null;
  var countdownTimer = null;

  function getTeleprompterScript() {
    var inputs = document.querySelectorAll("#editor-section .input-field");
    var title = inputs[0] && inputs[0].value ? inputs[0].value.trim() : "Menu Spesial Kami";
    var sub = inputs[1] && inputs[1].value ? inputs[1].value.trim() : "Porsi puas & bikin nagih";
    var oldP = inputs[2] && inputs[2].value ? inputs[2].value.trim() : "";
    var newP = inputs[3] && inputs[3].value ? inputs[3].value.trim() : "Rp 19.000";
    var storeEl = document.getElementById("storeNameInput");
    var store = storeEl && storeEl.value.trim() ? storeEl.value.trim() : "Warung Kami";
    var pricePhrase = oldP ? "harga normal " + oldP + " kini cuma " + newP : "spesial hari ini cuma " + newP;
    return '🎙️ Contekan 6 Detik: "Cobain ' + title + ' di ' + store + '! ' + sub + ', ' + pricePhrase + '. Buruan order sekarang!"';
  }

  function updateTeleprompterText() {
    var el = document.getElementById("wa-voice-prompter-text");
    if (el) el.textContent = getTeleprompterScript();
  }

  function createSizzleNoiseNode(audioCtx, destNode) {
    if (!sizzleEnabled) return null;
    try {
      var bufferSize = audioCtx.sampleRate * 6.5;
      var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < bufferSize; i++) {
        var mod = 0.65 + 0.35 * Math.sin(i / (audioCtx.sampleRate * 0.12));
        data[i] = (Math.random() * 2 - 1) * mod;
      }
      var noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      var filter = audioCtx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = 3400;
      filter.Q.value = 1.4;

      var gain = audioCtx.createGain();
      gain.gain.value = 0.045; // Subtle warm culinary sizzle

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(destNode);
      noise.start(0);
      return noise;
    } catch (e) {
      return null;
    }
  }

  function stopPreMicSession() {
    if (countdownTimer) {
      clearInterval(countdownTimer);
      countdownTimer = null;
    }
    if (meterRAF) {
      cancelAnimationFrame(meterRAF);
      meterRAF = null;
    }
    if (preMediaRecorder && preMediaRecorder.state !== "inactive") {
      try { preMediaRecorder.stop(); } catch (e) {}
    }
    if (preMicStream) {
      preMicStream.getTracks().forEach(function (t) { t.stop(); });
      preMicStream = null;
    }
    if (meterAudioCtx) {
      try { meterAudioCtx.close(); } catch (e) {}
      meterAudioCtx = null;
    }
    isMicPreRecording = false;
    var meterFill = document.getElementById("wa-voice-meter-bar");
    if (meterFill) meterFill.style.width = "0%";
  }

  function start6SecVoiceRecording() {
    var recBtn = document.getElementById("wa-voice-record-btn");
    var statusEl = document.getElementById("wa-voice-status-msg");
    var meterFill = document.getElementById("wa-voice-meter-bar");

    if (isMicPreRecording) {
      stopPreMicSession();
      if (recBtn) {
        recBtn.classList.remove("recording");
        recBtn.innerHTML = "🎙️ Rekam Suara Promosi 6 Detik (Mic HP)";
      }
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      if (statusEl) statusEl.textContent = "⚠️ Browser ini tidak mengizinkan akses mikrofon. Buka melalui HTTPS atau Chrome.";
      return;
    }

    navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    }).then(function (stream) {
      preMicStream = stream;
      isMicPreRecording = true;

      // Setup real-time VU meter
      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        meterAudioCtx = new AudioCtx();
        var src = meterAudioCtx.createMediaStreamSource(stream);
        var analyser = meterAudioCtx.createAnalyser();
        analyser.fftSize = 256;
        src.connect(analyser);
        var dataArr = new Uint8Array(analyser.frequencyBinCount);

        function updateMeter() {
          if (!isMicPreRecording) return;
          analyser.getByteFrequencyData(dataArr);
          var sum = 0;
          for (var i = 0; i < dataArr.length; i++) sum += dataArr[i];
          var avg = sum / dataArr.length;
          var pct = Math.min(100, Math.round((avg / 95) * 100));
          if (meterFill) meterFill.style.width = pct + "%";
          meterRAF = requestAnimationFrame(updateMeter);
        }
        updateMeter();
      } catch (e) {}

      var mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"].find(function (m) {
        return window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m);
      }) || "";

      preMediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      var chunks = [];
      preMediaRecorder.ondataavailable = function (ev) {
        if (ev.data && ev.data.size > 0) chunks.push(ev.data);
      };

      preMediaRecorder.onstop = function () {
        var blobType = mime || "audio/webm";
        recordedVoiceBlob = new Blob(chunks, { type: blobType });
        if (recordedVoiceUrl) URL.revokeObjectURL(recordedVoiceUrl);
        recordedVoiceUrl = URL.createObjectURL(recordedVoiceBlob);

        var playerWrap = document.getElementById("wa-voice-SavedPlayerWrap");
        var audioEl = document.getElementById("wa-voice-audio-preview");
        if (audioEl) audioEl.src = recordedVoiceUrl;
        if (playerWrap) playerWrap.style.display = "flex";

        if (recBtn) {
          recBtn.classList.remove("recording");
          recBtn.innerHTML = "🔄 Rekam Ulang Suara (6 Detik)";
        }
        if (statusEl) {
          statusEl.style.color = "#4ade80";
          statusEl.textContent = "✅ Suara berhasil direkam! Klik 'Unduh Video 6 Detik' di bawah untuk menggabungkan suara ke video.";
        }
        stopPreMicSession();
      };

      preMediaRecorder.start(200);
      var secLeft = 6.0;
      if (recBtn) {
        recBtn.classList.add("recording");
        recBtn.innerHTML = "⏹️ Merekam Suara... (6.0d) — Ketuk untuk Selesai";
      }
      if (statusEl) {
        statusEl.style.color = "#fde047";
        statusEl.textContent = "🎙️ Silakan bicara sekarang! Bacakan teks contekan di atas dengan semangat...";
      }

      countdownTimer = setInterval(function () {
        secLeft = Math.max(0, secLeft - 0.1);
        if (recBtn && isMicPreRecording) {
          recBtn.innerHTML = "⏹️ Merekam Suara... (" + secLeft.toFixed(1) + "d) — Ketuk Stop";
        }
        if (secLeft <= 0) {
          stopPreMicSession();
        }
      }, 100);

    }).catch(function () {
      if (statusEl) {
        statusEl.style.color = "#f87171";
        statusEl.textContent = "⚠️ Izin mikrofon ditolak. Izinkan akses mikrofon di pengaturan browser HP Anda.";
      }
    });
  }

  // Hook utama untuk menggabungkan Canvas Video Stream (30 FPS) + Suara Mic User / Efek Sizzle
  window.__warungRecordVideoWithVoice = async function (canvasEl, setRecordingState, setRenderMode, showToast) {
    var liveMicStream = null;
    var mixAudioCtx = null;
    var voiceAudioEl = null;

    try {
      var canvasStream = canvasEl.captureStream ? canvasEl.captureStream(30) : null;
      if (!canvasStream) throw new Error("Browser belum mendukung perekaman kanvas.");

      var finalTracks = canvasStream.getVideoTracks().slice();
      var AudioCtx = window.AudioContext || window.webkitAudioContext;

      if (AudioCtx && (audioMode !== "mute" || sizzleEnabled)) {
        mixAudioCtx = new AudioCtx();
        if (mixAudioCtx.state === "suspended") await mixAudioCtx.resume();
        var dest = mixAudioCtx.createMediaStreamDestination();
        var hasAudioSource = false;

        // 1. Jika mode Live Mic saat rekam video
        if (audioMode === "live" && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          try {
            liveMicStream = await navigator.mediaDevices.getUserMedia({
              audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
            });
            var micSource = mixAudioCtx.createMediaStreamSource(liveMicStream);
            var micGain = mixAudioCtx.createGain();
            micGain.gain.value = 1.25;
            micSource.connect(micGain);
            micGain.connect(dest);
            hasAudioSource = true;
          } catch (e) {
            showToast("⚠️ Mikrofon tidak aktif, merekam tanpa suara live.");
          }
        }

        // 2. Jika mode Rekaman Suara Tersimpan
        if (audioMode === "saved" && recordedVoiceUrl) {
          try {
            voiceAudioEl = new Audio(recordedVoiceUrl);
            voiceAudioEl.crossOrigin = "anonymous";
            var voiceSource = mixAudioCtx.createMediaElementSource(voiceAudioEl);
            var voiceGain = mixAudioCtx.createGain();
            voiceGain.gain.value = 1.2;
            voiceSource.connect(voiceGain);
            voiceGain.connect(dest);
            // Juga hubungkan ke speaker agar user bisa mendengar saat proses rekam
            voiceGain.connect(mixAudioCtx.destination);
            await voiceAudioEl.play();
            hasAudioSource = true;
          } catch (e) {}
        }

        // 3. Tambahkan Efek Desis Masakan (Sizzle) jika dicentang
        if (sizzleEnabled) {
          createSizzleNoiseNode(mixAudioCtx, dest);
          hasAudioSource = true;
        }

        if (hasAudioSource && dest.stream.getAudioTracks().length > 0) {
          finalTracks.push(dest.stream.getAudioTracks()[0]);
        }
      }

      var combinedStream = new MediaStream(finalTracks);
      var supportedMime = [
        "video/mp4;codecs=avc1,mp4a.40.2",
        "video/mp4",
        "video/webm;codecs=vp9,opus",
        "video/webm;codecs=vp8,opus",
        "video/webm"
      ].find(function (m) {
        return window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m);
      }) || "video/webm";

      var ext = supportedMime.indexOf("mp4") !== -1 ? "mp4" : "webm";
      var recorder = new MediaRecorder(combinedStream, {
        mimeType: supportedMime,
        videoBitsPerSecond: 5000000
      });

      var chunks = [];
      recorder.ondataavailable = function (e) {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = function () {
        if (liveMicStream) {
          liveMicStream.getTracks().forEach(function (t) { t.stop(); });
        }
        if (voiceAudioEl) {
          try { voiceAudioEl.pause(); } catch (e) {}
        }
        if (mixAudioCtx) {
          try { mixAudioCtx.close(); } catch (e) {}
        }

        var blob = new Blob(chunks, { type: supportedMime });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "warungads-reels-suara-6detik." + ext;
        a.click();
        setTimeout(function () { URL.revokeObjectURL(url); }, 3500);
        setRecordingState(false);
        setRenderMode("static");
        showToast("🎬 Video Reels 6 Detik + Suara Promosi berhasil diunduh!");
      };

      setRecordingState(true);
      setRenderMode("video");
      recorder.start(250);
      setTimeout(function () {
        try {
          if (recorder.state !== "inactive") recorder.stop();
        } catch (e) {}
      }, 6000);

      var modeNotice = audioMode === "live"
        ? "🎙️ Merekam Video + Suara Mic Langsung (6 detik)… Silakan bicara!"
        : (audioMode === "saved" && recordedVoiceUrl)
          ? "🎬 Menggabungkan Video 6 Detik + Rekaman Suara Anda…"
          : "🎬 Merekam Video 6 Detik… jangan tutup halaman ini.";
      showToast(modeNotice);

    } catch (err) {
      if (liveMicStream) liveMicStream.getTracks().forEach(function (t) { t.stop(); });
      setRecordingState(false);
      showToast("⚠️ Gagal merekam video di browser ini. Coba gunakan Chrome.");
    }
  };

  function injectVoiceOverStudioUI() {
    var previewSection = document.getElementById("preview-section");
    if (!previewSection || document.getElementById("wa-voice-studio-card")) return;

    var videoCard = document.getElementById("wa-gemini-reels-panel") ? document.getElementById("wa-gemini-reels-panel").parentNode : null;
    if (!videoCard) {
      var cards = previewSection.querySelectorAll("div");
      for (var ci = 0; ci < cards.length; ci++) {
        var t = cards[ci].textContent || "";
        if (t.indexOf("Preview Video Iklan") !== -1 || t.indexOf("Unduh Video 6 Detik") !== -1) {
          videoCard = cards[ci];
          break;
        }
      }
    }
    if (!videoCard) videoCard = previewSection.querySelector("div") || previewSection;

    var downloadVideoBtn = null;
    var allBtns = videoCard.querySelectorAll("button");
    for (var i = 0; i < allBtns.length; i++) {
      var txt = allBtns[i].textContent || "";
      if (txt.indexOf("Unduh Video 6 Detik") !== -1 || txt.indexOf("Merekam") !== -1) {
        downloadVideoBtn = allBtns[i];
        break;
      }
    }
    if (!downloadVideoBtn) downloadVideoBtn = previewSection.querySelector("button");
    if (!downloadVideoBtn) return;

    var box = document.createElement("div");
    box.id = "wa-voice-studio-card";
    box.className = "wa-voice-card";

    box.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
          '<span style="background:#e11d48;color:#fff;font-size:.63rem;font-weight:900;padding:3px 8px;border-radius:99px;letter-spacing:.03em;">🎙️ FITUR BARU</span>' +
          '<span style="font-family:Poppins,sans-serif;font-weight:900;font-size:.84rem;">Studio Dubbing & Suara Mic HP</span>' +
        '</div>' +
        '<label style="display:inline-flex;align-items:center;gap:5px;font-size:.69rem;font-weight:800;cursor:pointer;color:#fde047;">' +
          '<input type="checkbox" id="wa-voice-sizzle-chk" checked style="accent-color:#e11d48;width:14px;height:14px;">' +
          '<span>🔥 Efek Suara Masakan</span>' +
        '</label>' +
      '</div>' +

      '<p style="font-size:.71rem;color:var(--text-muted);margin-top:4px;line-height:1.4;">' +
        'Rekam suara promosi Anda langsung dari mikrofon HP. Otomatis menyatu ke dalam file <strong>Unduh Video 6 Detik</strong> tanpa mengurangi kecepatan aplikasi.' +
      '</p>' +

      '<div class="wa-voice-mode-grid">' +
        '<button type="button" data-vmode="saved" class="wa-voice-mode-btn active">' +
          '🎙️ <strong>Rekam Dulu</strong><br><span style="font-size:.62rem;opacity:.8;">Simpan 6 Detik</span>' +
        '</button>' +
        '<button type="button" data-vmode="live" class="wa-voice-mode-btn">' +
          '🔴 <strong>Live Dubbing</strong><br><span style="font-size:.62rem;opacity:.8;">Saat Unduh Video</span>' +
        '</button>' +
        '<button type="button" data-vmode="mute" class="wa-voice-mode-btn">' +
          '🔇 <strong>Tanpa Mic</strong><br><span style="font-size:.62rem;opacity:.8;">Visual / Sizzle</span>' +
        '</button>' +
      '</div>' +

      '<div id="wa-voice-prompter-text" class="wa-voice-teleprompter">' +
        getTeleprompterScript() +
      '</div>' +

      '<div id="wa-voice-saved-controls" style="margin-top:9px;">' +
        '<button type="button" id="wa-voice-record-btn" class="wa-voice-rec-btn">' +
          '🎙️ Rekam Suara Promosi 6 Detik (Mic HP)' +
        '</button>' +
        '<div class="wa-voice-meter-wrap" title="Indikator Volume Suara Mikrofon">' +
          '<div id="wa-voice-meter-bar" class="wa-voice-meter-fill"></div>' +
        '</div>' +
        '<div id="wa-voice-SavedPlayerWrap" style="display:none;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding:7px 9px;border-radius:10px;background:rgba(15,23,42,0.75);border:1px solid rgba(74,222,128,0.4);">' +
          '<audio id="wa-voice-audio-preview" controls style="height:30px;flex:1;max-width:210px;"></audio>' +
          '<button type="button" id="wa-voice-delete-btn" class="wa-voice-pill" style="color:#fca5a5;border-color:rgba(248,113,113,0.4);">🗑️ Hapus</button>' +
        '</div>' +
      '</div>' +

      '<div id="wa-voice-status-msg" style="margin-top:6px;font-size:.69rem;font-weight:700;color:#94a3b8;">' +
        '💡 Tips: Rekam suara Anda dulu 6 detik, dengarkan hasilnya, lalu klik tombol <strong>Unduh Video 6 Detik</strong> di bawah.' +
      '</div>';

    downloadVideoBtn.parentNode.insertBefore(box, downloadVideoBtn);

    // Event listeners
    var sizzleChk = document.getElementById("wa-voice-sizzle-chk");
    if (sizzleChk) {
      sizzleChk.addEventListener("change", function () {
        sizzleEnabled = !!sizzleChk.checked;
      });
    }

    var modeBtns = box.querySelectorAll("[data-vmode]");
    var savedControls = document.getElementById("wa-voice-saved-controls");
    var statusEl = document.getElementById("wa-voice-status-msg");

    modeBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        modeBtns.forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        audioMode = btn.getAttribute("data-vmode") || "saved";
        if (savedControls) {
          savedControls.style.display = audioMode === "saved" ? "block" : "none";
        }
        if (statusEl) {
          statusEl.style.color = "#94a3b8";
          if (audioMode === "saved") {
            statusEl.innerHTML = "💡 Mode <strong>Rekam Dulu</strong>: Rekam suara Anda 6 detik, cek hasilnya, lalu klik <strong>Unduh Video 6 Detik</strong>.";
          } else if (audioMode === "live") {
            statusEl.innerHTML = "🔴 Mode <strong>Live Dubbing</strong>: Saat Anda klik <strong>Unduh Video 6 Detik</strong>, mikrofon otomatis menyala dan merekam suara Anda bersamaan dengan video!";
          } else {
            statusEl.innerHTML = "🔇 Mode <strong>Tanpa Mic</strong>: Video direkam tanpa suara mikrofon (hanya visual + efek masakan jika dicentang).";
          }
        }
      });
    });

    var recBtn = document.getElementById("wa-voice-record-btn");
    if (recBtn) {
      recBtn.addEventListener("click", start6SecVoiceRecording);
    }

    var delBtn = document.getElementById("wa-voice-delete-btn");
    if (delBtn) {
      delBtn.addEventListener("click", function () {
        if (recordedVoiceUrl) URL.revokeObjectURL(recordedVoiceUrl);
        recordedVoiceBlob = null;
        recordedVoiceUrl = "";
        var wrap = document.getElementById("wa-voice-SavedPlayerWrap");
        if (wrap) wrap.style.display = "none";
        if (recBtn) recBtn.innerHTML = "🎙️ Rekam Suara Promosi 6 Detik (Mic HP)";
        if (statusEl) {
          statusEl.style.color = "#94a3b8";
          statusEl.textContent = "🗑️ Rekaman suara dihapus. Silakan rekam ulang.";
        }
      });
    }

    document.addEventListener("input", function (e) {
      if (e.target && e.target.classList && e.target.classList.contains("input-field")) {
        updateTeleprompterText();
      }
    });
  }

  var vTimer = null;
  var obs = new MutationObserver(function () {
    if (document.getElementById("wa-voice-studio-card")) return;
    if (vTimer) return;
    vTimer = requestAnimationFrame(function () {
      vTimer = null;
      injectVoiceOverStudioUI();
    });
  });
  obs.observe(document.getElementById("root") || document.body, { childList: true, subtree: true });
  window.addEventListener("DOMContentLoaded", injectVoiceOverStudioUI);
  setTimeout(injectVoiceOverStudioUI, 300);
})();
</script>

<script id="wa-theme-sync-engine">
(function() {
  function syncRootTheme() {
    var themedDiv = document.querySelector("#root > div[data-theme]");
    if (!themedDiv) return;
    var currentTheme = themedDiv.getAttribute("data-theme") || "dark";
    if (document.documentElement.getAttribute("data-theme") !== currentTheme) {
      document.documentElement.setAttribute("data-theme", currentTheme);
    }
    var metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme) {
      metaTheme.setAttribute("content", currentTheme === "light" ? "#f1f5f9" : "#090a0f");
    }
  }
  var themeTimer = null;
  var obs = new MutationObserver(function () {
    if (themeTimer) return;
    themeTimer = requestAnimationFrame(function () {
      themeTimer = null;
      syncRootTheme();
    });
  });
  obs.observe(document.getElementById("root") || document.body, { attributes: true, attributeFilter: ["data-theme"], childList: true, subtree: true });
  window.addEventListener("DOMContentLoaded", syncRootTheme);
  setTimeout(syncRootTheme, 150);
})();
</script>
